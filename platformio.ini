; M5AirMouse — M5Stack StopWatch Dev Kit 空中鼠标
;
; 硬件: ESP32-S3 / 16MB Flash / 8MB PSRAM / 466x466 圆 AMOLED
;       BMI270 六轴 IMU / 2 个按键 / 振动马达
;
; 功能: BLE HID 鼠标, 陀螺仪控制指针, A 左键 B 右键

[platformio]
default_envs = airmouse

[env:airmouse]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified @ 0.2.28
    m5stack/M5GFX @ 0.2.35
    m5stack/M5PM1 @ 1.0.7
    m5stack/M5IOE1 @ 1.0.9
    h2zero/NimBLE-Arduino @ 2.5.1
